services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tetraknowledge
      POSTGRES_USER: tetraknowledge
      POSTGRES_PASSWORD: tetraknowledge
    ports: ["5434:5432"]
    volumes: ["tetraknowledge_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tetraknowledge -d tetraknowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tetraknowledge:tetraknowledge@postgres:5432/tetraknowledge
      EMBEDDING_PROVIDER: hash
      LLM_PROVIDER: rule_based
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn tetraknowledge.api.main:app --host 0.0.0.0 --port 8000"]
volumes:
  tetraknowledge_pgdata:
