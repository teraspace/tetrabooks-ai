apiVersion: apps/v1
kind: Deployment
metadata: {name: tetraknowledge-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: tetraknowledge-api}}
  template:
    metadata: {labels: {app: tetraknowledge-api}}
    spec:
      containers:
        - name: api
          image: tetraknowledge-ai:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: tetraknowledge-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: 8000}}
          livenessProbe: {httpGet: {path: /health, port: 8000}}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
