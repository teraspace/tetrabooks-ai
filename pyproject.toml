[project]
name = "tetrabooks-ai"
version = "0.1.0"
description = "Production-minded RAG and document intelligence backend for TetraBooks"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "python-multipart>=0.0.9,<1", "pypdf>=5,<6", "langchain-core>=0.3,<1", "langgraph>=0.2,<1", "httpx>=0.27,<1", "numpy>=1.26,<3", "prometheus-client>=0.21,<1", "openai>=1.55,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
local-embeddings = ["sentence-transformers>=3,<4"]
azure = ["openai>=1.55,<2", "azure-search-documents>=11.6,<12", "azure-ai-documentintelligence>=1.0,<2"]
demo = ["streamlit>=1.40,<2", "pandas>=2.2,<3"]
otel = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<1"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tetraknowledge"]
